site_name: 人工智能与机器学习基础
site_description: 2026 秋人工智能与机器学习基础课程资料、实验与在线评测
site_url: https://aiml.temaurinum.moe/
repo_url: https://github.com/Intelligent114/aiml
repo_name: Intelligent114/aiml
edit_uri: ""
copyright: 课程资料由 Intelligent114 维护

theme:
  name: material
  language: zh
  favicon: assets/images/favicon.svg
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 跟随系统主题

nav:
  - 课程首页: index.md
  - 课程安排: schedule.md
  - 作业: assignments.md
  - 实验: labs.md
  - 在线评测: online-judge.md
  - Stanford CS229: cs229.md
  - 其他课程:
      - 线性代数: https://la.temaurinum.moe/
      - 计算方法: https://cm.temaurinum.moe/
      - 主站: https://temaurinum.moe/

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

strict: true
use_directory_urls: true

<button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
  <span aria-hidden="true">◐</span>
  <span data-theme-label>切换主题</span>
</button>
<script>
  jtd.onReady(() => {
    const toggle = document.getElementById("theme-toggle");
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const apply = (theme, remember) => {
      window.__courseSiteTheme = theme;
      document.documentElement.dataset.theme = theme;
      jtd.setTheme(theme);
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#27262b" : "#f5f6fa";
      toggle.querySelector("[data-theme-label]").textContent = theme === "dark" ? "浅色" : "深色";
      toggle.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
      if (remember) try { localStorage.setItem("course-site-theme", theme); } catch (_) {}
    };
    apply(window.__courseSiteTheme || "light", false);
    toggle.addEventListener("click", () => apply(window.__courseSiteTheme === "dark" ? "light" : "dark", true));
    media.addEventListener?.("change", event => {
      let stored = null;
      try { stored = localStorage.getItem("course-site-theme"); } catch (_) {}
      if (!stored) apply(event.matches ? "dark" : "light", false);
    });
  });
</script>

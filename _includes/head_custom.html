<meta name="theme-color" content="#f5f6fa">
<script>
  (() => {
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    let stored = null;
    try { stored = localStorage.getItem("course-site-theme"); } catch (_) {}
    const theme = stored === "dark" || stored === "light" ? stored : (media.matches ? "dark" : "light");
    window.__courseSiteTheme = theme;
    document.documentElement.dataset.theme = theme;
    jtd.setTheme(theme);
    document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#27262b" : "#f5f6fa";
  })();
</script>
